app:
  logging:
    level: INFO
  redis:
    host: localhost
    port: 6379

  keycloak:
    url: ${KEYCLOAK_URL}
    realm: serp
    client-id: serp-api-gateway
    client-secret: ${CLIENT_SECRET}
    jwk-set-uri: ${KEYCLOAK_URL}/realms/serp/protocol/openid-connect/certs
    expected-issuer: ${KEYCLOAK_URL}/realms/serp
    expected-audience:

  rateLimit:
    enabled: true
    defaultIP:
      limit: 100
      windowSecs: 60
    defaultUser:
      limit: 200
      windowSecs: 60
    routeOverrides:
      login:
        path: "/api/v1/auth/login"
        method: "POST"
        ip:
          limit: 10
          windowSecs: 60
      register:
        path: "/api/v1/auth/register"
        method: "POST"
        ip:
          limit: 5
          windowSecs: 60
      refreshToken:
        path: "/api/v1/auth/refresh-token"
        method: "POST"
        ip:
          limit: 20
          windowSecs: 60

  cors:
    allowedOrigins:
      - http://localhost:3000
      - https://serp-soict.vercel.app
    allowedMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowedHeaders:
      - Authorization
      - Content-Type
    allowCredentials: true
    maxAge: 3600
    allowFiles: false

  resilience:
    maxRequests: 3
    interval: 60s
    timeout: 30s
    consecutiveFailures: 10
    failureRatio: 0.6
    minRequests: 10
    maxRetries: 3
    initialDelay: 100ms
    maxDelay: 2s

  transport:
    maxIdleConns: 200
    maxIdleConnsPerHost: 100
    maxConnsPerHost: 200
    idleConnTimeout: 90s
    dialTimeout: 5s
    tlsHandshakeTimeout: 5s
    responseHeaderTimeout: 15s
    expectContinueTimeout: 1s

