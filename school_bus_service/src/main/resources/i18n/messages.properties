# =============================================================================
# School Bus Service — English i18n messages
# Priority file: loaded before the default messages.properties fallback.
# Key convention:
#   - AppErrorCode enum names → generic error codes
#   - domain.action.detail   → domain-specific business messages
#   - {0}, {1}, ...          → positional MessageFormat arguments
# =============================================================================

