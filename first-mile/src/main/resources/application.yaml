server:
  port: ${SERVER_PORT:8101}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: first-mile
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/serp/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/serp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/first-mile}
    username: ${DB_USERNAME:serp}
    password: ${DB_PASSWORD:serp123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:true}
    open-in-view: false
  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      encoding: UTF-8
      schema-locations:
        - classpath:db/migration/province.sql
        - classpath:db/migration/ward.sql
        - classpath:db/migration/post-office.sql
        - classpath:db/migration/post-office-add-hub-id.sql
        - classpath:db/migration/post-office-delivery-capacity.sql
        - classpath:db/migration/post-office-staff.sql
        - classpath:db/migration/post-office-staff-drop-shift-window.sql
        - classpath:db/migration/vehicle.sql
        - classpath:db/migration/trip.sql
        - classpath:db/migration/trip-type.sql
        - classpath:db/migration/pickup-checkin.sql
        - classpath:db/migration/post-office-handover-manifests.sql
        - classpath:db/migration/post-office-handover-manifest-assignment.sql
        - classpath:db/migration/order-storage-compatibility.sql
        - classpath:db/migration/order-transition-outbox.sql
        - classpath:db/migration/kafka-dlq-message.sql
        - classpath:db/migration/delivery-manifests.sql
        - classpath:db/migration/delivery-manifest-orders.sql
  messages:
    basename: i18n/messages
    use-code-as-default-message: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_FIRST_MILE_GROUP_ID:first-mile-sync-user}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

app:
  delivery:
    max-attempts: ${MAX_DELIVERY_ATTEMPTS:3}
    manifest-code-prefix: DM
  kafka:
    topics:
      sync-user-first-mile: ${SYNC_USER_FIRST_MILE_TOPIC:SYNC_USER}
      sync-hub-post-office: ${SYNC_HUB_POST_OFFICE_TOPIC:HUB_POST_OFFICE_SYNC}
      sync-handover-manifest: ${SYNC_HANDOVER_MANIFEST_TOPIC:HANDOVER_MANIFEST_SYNC}
    hub-post-office-sync:
      consumer-group-id: ${KAFKA_FIRST_MILE_HUB_PO_GROUP:first-mile-sync-hub-post-office}
    handover-manifest-sync:
      consumer-group-id: ${KAFKA_FIRST_MILE_HANDOVER_MANIFEST_GROUP:first-mile-sync-handover-manifest}
    dlq:
      retry-interval-ms: ${KAFKA_DLQ_RETRY_INTERVAL_MS:30000}
      batch-size: ${KAFKA_DLQ_BATCH_SIZE:50}
      max-retries: ${KAFKA_DLQ_MAX_RETRIES:5}

internal-api:
  api-key: ${INTERNAL_API_KEY:}
  roles: ${INTERNAL_API_ROLES:TMS_ADMIN,TMS_POSTOFFICER_MANAGER,TMS_POSTOFFICER,TMS_HUB_MANAGER,TMS_HUB_EMPLOYEE}

tms-order:
  service:
    base-url: ${TMS_ORDER_SERVICE_BASE_URL:http://localhost:8105}
    lookup-path: ${TMS_ORDER_LOOKUP_PATH:/api/v1/internal/orders/lookup}
    pickup-candidates-path: ${TMS_ORDER_PICKUP_CANDIDATES_PATH:/api/v1/internal/orders/pickup-candidates}
    status-transitions-path: ${TMS_ORDER_STATUS_TRANSITIONS_PATH:/api/v1/internal/orders/status-transitions}
    payment-status-path: ${TMS_ORDER_PAYMENT_STATUS_PATH:/api/v1/internal/orders/payment-status}
  transition-outbox:
    retry-interval-ms: ${TMS_ORDER_TRANSITION_OUTBOX_RETRY_INTERVAL_MS:30000}

payment:
  service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8103}
    gateway-code: ${PAYMENT_SERVICE_GATEWAY_CODE:zalopay}
    create-order-path-template: ${PAYMENT_SERVICE_CREATE_ORDER_PATH_TEMPLATE:/v1/payments/%s/create-order}
    query-order-path-template: ${PAYMENT_SERVICE_QUERY_ORDER_PATH_TEMPLATE:/v1/payments/%s/query-order}
    redirect-url: ${PAYMENT_REDIRECT_URL:http://localhost:3000/payment/result}

second-mile:
  service:
    base-url: ${SECOND_MILE_SERVICE_BASE_URL:http://localhost:8102}
    validate-handover-outbound-sync-path: ${SECOND_MILE_VALIDATE_HANDOVER_OUTBOUND_SYNC_PATH:/api/v1/handover-manifests/internal/validate-outbound-sync}

geocode:
  base-url: ${GEOCODE_BASE_URL:https://rsapi.goong.io/geocode}
  api-key: ${GOONG_API_KEY:${GEOCODE_API_KEY:${GEOCODE-API-KEY:}}}
  rate-limit:
    tps: ${GEOCODE_RATE_LIMIT_TPS:1}

distance-matrix:
  base-url: ${DISTANCE_MATRIX_BASE_URL:https://rsapi.goong.io/DistanceMatrix}
  api-key: ${GOONG_API_KEY:${GEOCODE_API_KEY:${GEOCODE-API-KEY:}}}
  batch-size: ${DISTANCE_MATRIX_BATCH_SIZE:20}
  max-nodes: ${DISTANCE_MATRIX_MAX_NODES:120}

storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:https://sgp1.digitaloceanspaces.com}
    region: ${STORAGE_S3_REGION:sgp1}
    bucket: ${STORAGE_S3_BUCKET:datn-tms}
    access-key: ${STORAGE_S3_ACCESS_KEY:}
    secret-key: ${STORAGE_S3_SECRET_KEY:}
    public-base-url: ${STORAGE_S3_PUBLIC_BASE_URL:https://datn-tms.sgp1.digitaloceanspaces.com}
    path-style-access-enabled: ${STORAGE_S3_PATH_STYLE_ACCESS_ENABLED:false}
    max-file-size-bytes: ${STORAGE_S3_MAX_FILE_SIZE_BYTES:104857600}

logging:
  level:
    org.apache.kafka.clients.NetworkClient: ${KAFKA_NETWORK_CLIENT_LOG_LEVEL:ERROR}
