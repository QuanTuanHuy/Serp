spring:
  application:
    name: first-mile
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/first-mile}
    username: ${DB_USERNAME:serp}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations:
        - classpath:db/migration/province.sql
        - classpath:db/migration/ward.sql
  messages:
    basename: i18n/messages
    use-code-as-default-message: true
