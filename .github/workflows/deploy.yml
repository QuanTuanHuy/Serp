name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      account: ${{ steps.changes.outputs.account }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      ptm-task: ${{ steps.changes.outputs.ptm-task }}
      ptm-schedule: ${{ steps.changes.outputs.ptm-schedule }}
      ptm-optimization: ${{ steps.changes.outputs.ptm-optimization }}
      crm: ${{ steps.changes.outputs.crm }}
      first-mile: ${{ steps.changes.outputs.first-mile }}
      second-mile: ${{ steps.changes.outputs.second-mile }}
      tms-order: ${{ steps.changes.outputs.tms-order }}
      tms-billing-service: ${{ steps.changes.outputs.tms-billing-service }}
      serp-web: ${{ steps.changes.outputs.serp-web }}
      purchase: ${{ steps.changes.outputs.purchase }}
      logistics: ${{ steps.changes.outputs.logistics }}
      sales: ${{ steps.changes.outputs.sales }}
      logistics2: ${{ steps.changes.outputs.logistics2 }}
      routing: ${{ steps.changes.outputs.routing }}
      notification: ${{ steps.changes.outputs.notification }}
      discuss-service: ${{ steps.changes.outputs.discuss-service }}
      tms-payment-service: ${{ steps.changes.outputs.tms-payment-service }}
      pm-core: ${{ steps.changes.outputs.pm-core }}
      school-bus-service: ${{ steps.changes.outputs.school-bus-service }}
      ttcrs: ${{ steps.changes.outputs.ttcrs }}
    steps:
      - name: Download changes artifact

        uses: actions/download-artifact@v4
        with:
          name: build-changes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read changes
        id: changes
        run: |
          echo "account=$(jq -r .account changes.json)" >> $GITHUB_OUTPUT
          echo "api-gateway=$(jq -r '."api-gateway"' changes.json)" >> $GITHUB_OUTPUT
          echo "ptm-task=$(jq -r '."ptm-task"' changes.json)" >> $GITHUB_OUTPUT
          echo "ptm-schedule=$(jq -r '."ptm-schedule"' changes.json)" >> $GITHUB_OUTPUT
          echo "ptm-optimization=$(jq -r '."ptm-optimization"' changes.json)" >> $GITHUB_OUTPUT
          echo "crm=$(jq -r .crm changes.json)" >> $GITHUB_OUTPUT
          echo "first-mile=$(jq -r '."first-mile"' changes.json)" >> $GITHUB_OUTPUT
          echo "second-mile=$(jq -r '."second-mile"' changes.json)" >> $GITHUB_OUTPUT
          echo "tms-order=$(jq -r '."tms-order"' changes.json)" >> $GITHUB_OUTPUT
          echo "tms-billing-service=$(jq -r '."tms-billing-service"' changes.json)" >> $GITHUB_OUTPUT
          echo "serp-web=$(jq -r '."serp-web"' changes.json)" >> $GITHUB_OUTPUT
          echo "purchase=$(jq -r .purchase changes.json)" >> $GITHUB_OUTPUT
          echo "logistics=$(jq -r .logistics changes.json)" >> $GITHUB_OUTPUT
          echo "sales=$(jq -r .sales changes.json)" >> $GITHUB_OUTPUT
          echo "logistics2=$(jq -r '."logistics2"' changes.json)" >> $GITHUB_OUTPUT
          echo "routing=$(jq -r '."routing"' changes.json)" >> $GITHUB_OUTPUT
          echo "notification=$(jq -r .notification changes.json)" >> $GITHUB_OUTPUT
          echo "discuss-service=$(jq -r '."discuss-service"' changes.json)" >> $GITHUB_OUTPUT
          echo "tms-payment-service=$(jq -r '."tms-payment-service"' changes.json)" >> $GITHUB_OUTPUT
          echo "pm-core=$(jq -r '."pm-core"' changes.json)" >> $GITHUB_OUTPUT
          echo "school-bus-service=$(jq -r '."school-bus-service"' changes.json)" >> $GITHUB_OUTPUT
          echo "ttcrs=$(jq -r .ttcrs changes.json)" >> $GITHUB_OUTPUT

  deploy-account:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.account == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Account Service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}/serp_account
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  deploy-api-gateway:
